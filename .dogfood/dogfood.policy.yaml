version: 1
profile: authoritative

criteria:
  minimumDeterministic: 4
  forbidAllExcluded: true
  requiredGates: [verification]

baseline:
  blockRemovedDeterministic: true
  blockClassDowngrade: true
  blockPlaywrightToCommand: true
  blockRemovedRequiredGates: true

mutation:
  scope: git-root
  mode: git-visible
  allowUntracked:
    - artifacts/dogfood/**
    - examples/*/artifacts/dogfood/**
    - examples/*/test-results/**
    - test-results/**
    - playwright-report/**

build:
  requireSubject: false

logs:
  capture: full-redacted
  redactEnv:
    - GITHUB_TOKEN
    - "*_TOKEN"
    - "*_SECRET"
    - "*_PASSWORD"
    - "*_KEY"
    - "*_CREDENTIAL*"
  redactLiterals: []
