name: dogfood

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Optional drift detector (UTC). PRs and merge queues remain the merge gate.
    - cron: "17 2 * * *"

jobs:
  unit:
    name: unit / ${{ matrix.os }} / node-${{ matrix.node }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  playwright-fixture:
    name: playwright fixture / ubuntu / node-${{ matrix.node }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:playwright-fixture

  authoritative:
    name: authoritative bundle
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Resolve protected baseline
        id: baseline
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          if [ -n "$PR_BASE" ]; then
            echo "args=--baseline-ref $PR_BASE" >> "$GITHUB_OUTPUT"
          elif [ -n "$MERGE_BASE" ]; then
            echo "args=--baseline-ref $MERGE_BASE" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate authoritative contract
        run: node bin/dogfood.mjs validate --policy .dogfood/dogfood.policy.yaml ${{ steps.baseline.outputs.args }}
      - name: Run authoritative proof
        run: node bin/dogfood.mjs run --policy .dogfood/dogfood.policy.yaml ${{ steps.baseline.outputs.args }}
      - name: Verify generated bundle
        run: node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('artifacts/dogfood/latest.json')); require('child_process').execFileSync(process.execPath,['bin/dogfood.mjs','verify','artifacts/dogfood/'+p.path],{stdio:'inherit'})"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dogfood-evidence
          path: artifacts/dogfood/
          if-no-files-found: error

  junit:
    name: publish JUnit
    if: always()
    needs: [authoritative]
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dogfood-evidence
          path: artifacts/dogfood
      - uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: dogfood / prove-it
          path: artifacts/dogfood/**/junit.xml
          reporter: java-junit
          fail-on-error: "false"

  prove-it:
    name: dogfood / prove-it
    if: always()
    needs: [unit, playwright-fixture, authoritative, junit]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Require every proof job
        env:
          UNIT: ${{ needs.unit.result }}
          PLAYWRIGHT: ${{ needs.playwright-fixture.result }}
          AUTHORITATIVE: ${{ needs.authoritative.result }}
          JUNIT: ${{ needs.junit.result }}
        run: test "$UNIT" = success && test "$PLAYWRIGHT" = success && test "$AUTHORITATIVE" = success && test "$JUNIT" = success
