# Dogfood contract v2
# This starter is intentionally incomplete: validation fails until the criterion
# references a real oracle and the placeholder command is replaced.

version: 2
project: replace-with-project-name

build:
  requireIdentity: true

commands:
  replace-me:
    run: node -e "console.error('replace this placeholder command'); process.exit(1)"
    timeoutMs: 120000
    adapter: exit-code

gates:
  verification: [replace-me]

oracles:
  replace-me-oracle:
    kind: command
    command: replace-me

acceptanceCriteria:
  - id: AC-replace-me
    class: deterministic
    # Severity is classification metadata; every deterministic failure blocks.
    severity: blocker
    # oracle: replace-me-oracle
