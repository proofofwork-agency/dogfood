name: dogfood

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Optional drift detector (UTC). PRs and merge queues remain the merge gate.
    - cron: "17 2 * * *"

# Only superseded pull-request runs are cancelled; merge_group and push:main runs
# are the merge gate and must always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: tests / ${{ matrix.os }} / node-${{ matrix.node }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  authoritative:
    name: authoritative bundle
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # Only needed when your contract uses the playwright-json adapter. Delete this
      # block and the cache above it if every oracle of yours is exit-code or junit-xml.
      - name: Resolve Playwright version
        id: pw
        shell: bash
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Resolve protected baseline
        id: baseline
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          if [ -n "$PR_BASE" ]; then
            echo "ref=$PR_BASE" >> "$GITHUB_OUTPUT"
          elif [ -n "$MERGE_BASE" ]; then
            echo "ref=$MERGE_BASE" >> "$GITHUB_OUTPUT"
          else
            echo "ref=" >> "$GITHUB_OUTPUT"
            echo "::notice::No PR or merge-queue base; baseline regression rules are not applied on this event"
          fi
      - name: Validate authoritative contract
        shell: bash
        env:
          BASE_REF: ${{ steps.baseline.outputs.ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            npx dogfood validate --policy .dogfood/dogfood.policy.yaml --baseline-ref "$BASE_REF"
          else
            npx dogfood validate --policy .dogfood/dogfood.policy.yaml
          fi
      - name: Run authoritative proof
        shell: bash
        env:
          BASE_REF: ${{ steps.baseline.outputs.ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            npx dogfood run --policy .dogfood/dogfood.policy.yaml --baseline-ref "$BASE_REF"
          else
            npx dogfood run --policy .dogfood/dogfood.policy.yaml
          fi
      # The manifest, not the pointer, decides whether this bundle executed a proof at all.
      - name: Verify generated bundle
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            const pointer = JSON.parse(fs.readFileSync("artifacts/dogfood/latest.json", "utf8"));
            const bundle = "artifacts/dogfood/" + pointer.path;
            const manifest = JSON.parse(fs.readFileSync(bundle + "/manifest.json", "utf8"));
            if (manifest.mode !== "run") throw new Error("latest.json points at a " + manifest.mode + " bundle, which executes no proof");
            require("node:child_process").execFileSync("npx", ["dogfood", "verify", bundle], { stdio: "inherit", shell: process.platform === "win32" });
          '
      # Renders JUnit into the run summary with zero permissions, so fork pull
      # requests reach the same gate as branch pull requests.
      - name: Publish JUnit summary
        if: always()
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const target = process.env.GITHUB_STEP_SUMMARY;
            // The catch handler calls write() too, so a failing append must never escape it.
            const write = (text) => { try { if (target) fs.appendFileSync(target, text); } catch {} };
            const attr = (tag, key) => { const found = tag.match(new RegExp("\\b" + key + "=\"([^\"]{0,4096})\"")); return found ? found[1] : ""; };
            const decode = (value) => value.replaceAll("&lt;", "<").replaceAll("&gt;", ">").replaceAll("&quot;", "\"").replaceAll("&amp;", "&");
            // A suite or test name is arbitrary text; unescaped it breaks the row and injects markdown.
            const cell = (value) => decode(value).replace(/[|`\\]/g, "\\$&").replace(/[\r\n]+/g, " ");
            try {
              const root = "artifacts/dogfood";
              const files = !fs.existsSync(root) ? [] : fs.readdirSync(root, { withFileTypes: true })
                .filter((entry) => entry.isDirectory())
                .map((entry) => path.join(root, entry.name, "junit.xml"))
                .filter((file) => fs.existsSync(file));
              if (files.length === 0) { write("### dogfood JUnit\n\nNo junit.xml found under artifacts/dogfood/.\n"); process.exit(0); }
              const rows = [];
              const failed = [];
              for (const file of files) {
                const xml = fs.readFileSync(file, "utf8");
                for (const tag of xml.match(/<testsuite\b[^>]{0,4096}>/g) || []) rows.push("| " + [file, attr(tag, "name"), attr(tag, "tests"), attr(tag, "failures"), attr(tag, "errors"), attr(tag, "skipped"), attr(tag, "time")].map(cell).join(" | ") + " |");
                // Both spans are bounded so a malformed report cannot backtrack quadratically.
                for (const [, open, , body] of xml.matchAll(/<testcase\b([^>]{0,4096})(\/>|>([\s\S]{0,65536}?)<\/testcase>)/g)) {
                  if (!/<(failure|error)\b/.test(body || "")) continue;
                  failed.push("- `" + cell(attr(open, "classname")) + " / " + cell(attr(open, "name")) + "` — " + cell(attr(body, "message") || "failed"));
                }
              }
              write(["### dogfood JUnit", "", "| bundle | suite | tests | failures | errors | skipped | time (s) |", "| --- | --- | ---: | ---: | ---: | ---: | ---: |", ...rows, ""].join("\n"));
              if (failed.length > 0) write(["", "**Failing cases**", "", ...failed, ""].join("\n"));
            } catch (error) {
              write("### dogfood JUnit\n\nCould not summarize junit.xml: " + error.message + "\n");
            }
          '
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dogfood-evidence
          path: artifacts/dogfood/
          retention-days: 30
          if-no-files-found: error

  prove-it:
    name: dogfood / prove-it
    if: always()
    needs: [tests, authoritative]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every proof job
        env:
          TESTS: ${{ needs.tests.result }}
          AUTHORITATIVE: ${{ needs.authoritative.result }}
        run: test "$TESTS" = success && test "$AUTHORITATIVE" = success
